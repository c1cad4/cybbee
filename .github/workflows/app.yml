name: CybBee app checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check app/app.js && node --check app/checkout.js
      - run: node --test app/tests/*.test.js
      - run: node --test hosting/tests/api.test.mjs
      - run: python3 -m pip install -r server/requirements.txt
      - run: python3 -m unittest discover -s server/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: cybbee-pwa
          path: app/
